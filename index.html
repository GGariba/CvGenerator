<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Generator</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom styles (A4 paper dimensions, print-friendly overrides) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!--
    Main application background — sits OUTSIDE the PDF export target.
    The #cv-template element is the only thing exported to PDF.
  -->
  <div id="app-container" class="min-h-screen bg-slate-200 py-8 px-4">

    <!-- A4 paper — this is the ONLY element targeted by html2pdf.js -->
    <div id="cv-template" class="cv-paper mx-auto bg-white shadow-2xl overflow-hidden">
      <!-- Inner layout is built dynamically by render() in app.js -->
    </div>

    <!-- Floating action button — outside #cv-template so it is NOT in the PDF -->
    <button
      id="download-pdf-btn"
      type="button"
      class="fixed bottom-8 right-8 z-50 flex items-center gap-2 px-6 py-3 bg-indigo-600 text-white font-semibold rounded-full shadow-lg hover:bg-indigo-700 hover:shadow-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
      </svg>
      Download as PDF
    </button>

  </div>

  <!-- html2pdf.js for client-side PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Application logic -->
  <script src="app.js"></script>
</body>
</html>
